services:
  bank-importer:
    build:
      context: .
      dockerfile: Dockerfile
    image: bank-statement-importer:dev
    container_name: bank-statement-importer
    env_file:
      - .env
    environment:
      APP_ENV: development
      CLIENTS_CONFIG_PATH: /app/config/clients.yml
      LOG_LEVEL: INFO
      RUN_MODE: ${RUN_MODE:-api}
      POLL_INTERVAL_SECONDS: 300
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8080}
      PYTHONPATH: /app
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    volumes:
      - ./app:/app/app
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import pdfplumber, pytesseract, odoorpc, sqlalchemy; print('ok')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
